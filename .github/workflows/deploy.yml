name: deploy

# Auto-deploy the quorum stack when main advances (a PR is merged). Can also be
# run on demand from the Actions tab. The build runs on the server (ci/deploy.sh)
# — this job just opens an SSH session and streams the script in. The heavy Rust
# build means a run can take several minutes. Requires repo secrets
# DEPLOY_SSH_KEY + DEPLOY_HOST.
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
  workflow_dispatch:

# Never let two deploys overlap.
concurrency:
  group: deploy-quorum
  cancel-in-progress: false

jobs:
  # The test gate. Deploy cannot start until every job in ci.yml is green —
  # previously main deployed straight to production with nothing run at all.
  tests:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4      # only to get ci/deploy.sh onto the runner

      - name: Deploy over SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Prefer a pinned host key. ssh-keyscan re-TOFUs the host on every
          # run, which makes the StrictHostKeyChecking=yes below decorative:
          # whatever answers first is trusted. Set the DEPLOY_KNOWN_HOSTS
          # secret (output of `ssh-keyscan -H <host>`) to close that.
          if [ -n "${DEPLOY_KNOWN_HOSTS:-}" ]; then
            printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            echo "::warning::DEPLOY_KNOWN_HOSTS is not set — falling back to ssh-keyscan, which trusts whatever answers first"
            ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          fi
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "root@${DEPLOY_HOST}" 'bash -s' < ci/deploy.sh
