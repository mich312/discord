name: ci

# The test gate. Runs on every PR and every push to main, and is called by
# deploy.yml as a required prerequisite — nothing reaches production without
# these jobs going green first.
#
# Deliberately NOT gated on `cargo fmt --check`: the Rust here is
# hand-formatted and is not rustfmt-clean under any single config, so a
# formatting gate would fail for reasons unrelated to correctness. Adopting a
# formatter is a separate mechanical change.
on:
  push:
    # Work in this repo happens on claude/* branches and reaches main via PR,
    # so test those branches directly rather than waiting for a PR to open.
    branches: [main, 'claude/**']
  pull_request:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: rust tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The relay's Postgres contract tests are skipped unless TEST_DATABASE_URL
    # is set (relay/tests/pg_store.rs:1-3). Providing it here means the
    # PgStore/MemoryStore parity suite actually runs, which is where the
    # known store divergences live.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: relay_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: cargo test
        env:
          TEST_DATABASE_URL: postgres://postgres:test@127.0.0.1:5432/relay_test
        run: cargo test --workspace --all-targets

      # Advisory for now: clippy has never run against this codebase, so
      # -D warnings would be red on day one for pre-existing lints. Flip
      # `continue-on-error` off once the existing backlog is cleared.
      - name: cargo clippy (advisory)
        continue-on-error: true
        run: cargo clippy --workspace --all-targets -- -D warnings

  supply-chain:
    name: supply chain
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Non-blocking ONLY because of one outstanding advisory that cannot be
    # fixed from this repository (libcrux-sha3 0.0.8, pinned by hpke-rs) and
    # which is assessed as unreachable for our ciphersuite — the reasoning is
    # in deny.toml. The job still runs on every push and its findings are
    # visible; make it blocking again once openmls_rust_crypto bumps.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      # Known-vulnerable, yanked, unmaintained, or non-permissively-licensed
      # dependencies in a crypto stack are a release-blocking fact, not a
      # warning to triage later. Config in deny.toml.
      # Advisories and sources block. Licences and duplicate-version bans are
      # reported separately and do not block yet: the existing dependency
      # tree has never been audited on either axis, so failing on them now
      # would be red for reasons unrelated to the change under review. Same
      # staging as clippy above.
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories sources

      - name: cargo-deny licences and bans (advisory)
        continue-on-error: true
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses bans

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: client/package-lock.json

      # The client has three runtime dependencies, so a high-severity
      # advisory here is both rare and worth stopping for.
      - name: npm audit
        run: npm audit --audit-level=high
        working-directory: client

      # The lockfile must already satisfy package.json: `npm ci` fails if it
      # does not, which catches a hand-edited manifest before it ships.
      - name: lockfile is in sync
        run: npm ci --ignore-scripts
        working-directory: client

  # The deploy path cannot be exercised without a server, so at minimum it is
  # checked for the mistakes that would only surface mid-deploy: a script that
  # does not parse, and a compose stack that does not resolve.
  deploy-path:
    name: deploy path
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: deploy.sh parses
        run: bash -n ci/deploy.sh

      - name: deploy.sh is shellcheck-clean
        run: shellcheck ci/deploy.sh

      - name: the production overlay set resolves
        # The same three files ci/deploy.sh brings up. A typo here is a failed
        # deploy on the box rather than a failed check here.
        env:
          # The overlays fail closed on missing config — coturn refuses to
          # resolve without a secret rather than starting open — so the check
          # has to supply what a real deploy/.env would.
          CADDY_DOMAIN: example.test
          QUORUM_IMAGE: ghcr.io/example/quorum:test
          TURN_SECRET: not-a-real-secret
        run: |
          docker compose \
            -f docker-compose.yml \
            -f deploy/docker-compose.edge.yml \
            -f deploy/docker-compose.turn.yml config >/dev/null

      - name: the image ref is overridable, and defaults to a local build
        # deploy.sh switches on QUORUM_IMAGE; if compose stopped honouring it,
        # every deploy would silently keep running the old build-on-server path.
        run: |
          set -euo pipefail
          got=$(QUORUM_IMAGE=ghcr.io/example/quorum:pinned docker compose -f docker-compose.yml config \
                | grep -E '^\s+image: ghcr.io/example/quorum:pinned$' | wc -l)
          [ "$got" -eq 1 ] || { echo "QUORUM_IMAGE is not reaching the quorum service"; exit 1; }
          docker compose -f docker-compose.yml config | grep -q 'quorum-local:dev' \
            || { echo "the local-build default is gone"; exit 1; }

  client:
    name: client tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: client/package-lock.json

      - run: npm ci
        working-directory: client

      - name: node --test
        run: npm test
        working-directory: client

  build:
    name: wasm + client build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: install wasm-pack
        run: curl -sSf https://rustwasm.github.io/wasm-pack/installer/init.sh | sh

      # binaryen >= 116 — below that, build-wasm.sh silently ships an
      # unoptimized artifact. Installing it here means CI exercises the
      # optimized path the Docker image also builds.
      # NOT apt: Ubuntu's binaryen is 108, and versions below 116 miscompile
      # modules from current rustc (table growth breaks at runtime), so the
      # optimizer was being skipped on every CI build. Pinned to a specific
      # release so the artifact CI hashes is the artifact the Dockerfile
      # builds — a published hash that does not match production is worse
      # than none.
      - name: install binaryen
        env:
          BINARYEN_VERSION: '119'
        run: |
          set -euo pipefail
          url="https://github.com/WebAssembly/binaryen/releases/download/version_${BINARYEN_VERSION}/binaryen-version_${BINARYEN_VERSION}-x86_64-linux.tar.gz"
          curl -fsSL "$url" -o /tmp/binaryen.tar.gz
          tar -xzf /tmp/binaryen.tar.gz -C /tmp
          sudo install -m755 "/tmp/binaryen-version_${BINARYEN_VERSION}/bin/wasm-opt" /usr/local/bin/wasm-opt
          wasm-opt --version

      - name: build wasm
        # Hard-fail rather than quietly shipping an unoptimized artifact: a
        # release that silently differs from every local build is a difference
        # nobody thinks to look for.
        env:
          WASM_REQUIRE_OPT: '1'
        run: ./crypto-core/build-wasm.sh

      - run: npm ci
        working-directory: client

      # Also exercises scripts/inject-sri.mjs (non-zero if no asset tags get
      # stamped) and scripts/inject-integrity.mjs (non-zero if the wasm is
      # missing, ambiguous, or the worker's placeholder has been renamed).
      - name: vite build + SRI
        run: npm run build
        working-directory: client

      # Publish the hashes. This is what makes a deployment checkable by
      # someone who does not trust the server: fetch the files, hash them,
      # compare against this log. It is the verification half of §2.6 —
      # byte-for-byte reproducible builds are the other half and are NOT done.
      - name: publish the integrity manifest
        run: |
          echo "### Build integrity" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat client/dist/integrity.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: integrity-manifest
          path: client/dist/integrity.json
